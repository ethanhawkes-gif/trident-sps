<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Trident Ops Hub has moved</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f1f4f8; color: #0f1b2d; margin: 0; }
    main { max-width: 520px; margin: 12vh auto; background: #fff; border-radius: 14px; padding: 28px; box-shadow: 0 2px 12px rgba(15, 27, 45, .08); }
    h1 { font-size: 22px; margin: 0 0 12px; }
    p { line-height: 1.5; }
    a.btn, button { display: inline-block; background: #0b3a66; color: #fff; border: 0; border-radius: 10px; padding: 12px 18px; font-size: 16px; text-decoration: none; cursor: pointer; }
    button.secondary { background: #fff; color: #0b3a66; border: 1px solid #0b3a66; }
    #local { margin-top: 20px; padding-top: 16px; border-top: 1px solid #e3e8ef; }
  </style>
</head>
<body>
  <main>
    <h1>The Trident Ops Hub has moved</h1>
    <p>The shared, private version is here. Sign in with your Trident email; you will get a one-time code by email.</p>
    <p><a class="btn" href="https://trident-ops.signalry.ai/">Open the Ops Hub</a></p>
    <div id="local" hidden>
      <p><strong>This browser has changes saved in the old version</strong> (<span id="local-info"></span>).
        Download them and send the file to Chipper so nothing is lost.</p>
      <button class="secondary" id="dl" type="button">Download my saved changes</button>
    </div>
  </main>
  <script>
    (function () {
      var KEY = "trident-ops-hub-v3";
      var raw = null;
      try { raw = localStorage.getItem(KEY); } catch (e) { raw = null; }
      if (!raw) return;
      var info = "";
      try {
        var parsed = JSON.parse(raw);
        info = (parsed.orders || []).length + " work orders" + (parsed.savedAt ? ", last saved " + new Date(parsed.savedAt).toLocaleString() : "");
      } catch (e) { info = "saved data"; }
      document.getElementById("local-info").textContent = info;
      document.getElementById("local").hidden = false;
      document.getElementById("dl").addEventListener("click", function () {
        var blob = new Blob([raw], { type: "application/json" });
        var a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "trident-ops-hub-saved-changes.json";
        document.body.appendChild(a);
        a.click();
        a.remove();
      });
    })();
  </script>
</body>
</html>
